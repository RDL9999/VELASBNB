name: Radar · actualizar datos y publicar sitio

on:
  schedule:
    # Cada 6 horas
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-pages
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install --quiet playwright requests
          python -m playwright install --with-deps chromium

      - name: Ejecutar scraper (todas las fuentes)
        run: |
          cd radar_oportunidades
          python3 scraper/scraper.py || python3 scraper/scraper.py --no-web || true

      - name: Commit de datos actualizados
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add radar_oportunidades/datos/ radar_oportunidades/scraper/capacitate_cache.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "chore(radar): actualización automática de datos $(date -u +%FT%TZ)"
            git push
          fi

      - name: Montar sitio estático
        run: bash radar_oportunidades/publicar.sh

      - name: Habilitar GitHub Pages (si aún no existe)
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}' || echo "Pages ya habilitado o requiere configuración manual"

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
